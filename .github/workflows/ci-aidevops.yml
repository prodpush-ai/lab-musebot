# Generated by AI DevOps (F95). PR-only — this workflow deploys on YOUR runner with YOUR
# secrets; the platform never applies. Promotion: production.
name: CI/CD
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: branch, tag or sha to deploy
        required: false
        default: ''
      app:
        description: target app or project (blank = the one in the config)
        required: false
        default: ''
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libopus-dev
      - run: go mod download
      - run: go test ./...
      - run: go build ./...

  build-image:
    needs: [build-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - id: meta
        run: |
          repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/$repo" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          tags: ${{ steps.meta.outputs.image }}:${{ inputs.ref || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  deploy-production:
    needs: [build-image]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Write kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config
      - run: kubectl apply -n prod -k ${{ vars.K8S_PATH || 'k8s/production' }}
      - run: >-
          kubectl set image -n prod
          deploy/${{ inputs.app || vars.K8S_DEPLOYMENT || github.event.repository.name }}
          app=${{ needs['build-image'].outputs.image }}:${{ inputs.ref || github.sha }}
      - run: >-
          kubectl rollout status -n prod
          deploy/${{ inputs.app || vars.K8S_DEPLOYMENT || github.event.repository.name }} --timeout=5m

