apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-musebot
  labels:
    app.kubernetes.io/name: lab-musebot
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: lab-musebot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lab-musebot
    spec:
      containers:
        - name: app
          image: lab-musebot:latest
          ports:
            # port: the first of the ports the Dockerfile EXPOSEs (36060, 18080); nothing says which one serves HTTP, so check it
            - containerPort: 36060
          # readiness path: the route `/pong` is declared in http/http.go
          readinessProbe:
            httpGet:
              path: /pong
              port: 36060
            initialDelaySeconds: 5
            periodSeconds: 5
