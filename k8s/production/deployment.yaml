apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-musebot
  labels:
    app.kubernetes.io/name: lab-musebot
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: lab-musebot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lab-musebot
    spec:
      containers:
        - name: app
          image: lab-musebot:latest
          ports:
            - containerPort: 8080
          # readiness path: GUESSED: no health route found in the files read; if the app does not answer 2xx on `/`, the probe never passes and the rollout stalls
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
